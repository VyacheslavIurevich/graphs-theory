# Git submodules (spla-bench, Galois, …) are third-party; never lint them.
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["task2/scripts"]
force-exclude = true
extend-exclude = [
    "task1/spla-bench",
    "task2/deps",
    "task2/build",
    "task2/third_party",
]

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "RUF",
    "SIM",
    "UP",
    "W",
]
ignore = [
    "E501",  # markdown tables and long help strings; ruff format wraps code
]

[tool.mypy]
python_version = "3.10"
files = ["task2/scripts"]
mypy_path = "task2/scripts"
explicit_package_bases = true
namespace_packages = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
exclude = [
    "(^|/)task1/spla-bench/",
    "(^|/)task2/deps/",
    "(^|/)task2/build/",
    "(^|/)task2/third_party/",
]
