name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: shellcheck + shfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck and shfmt
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          curl -fsSL -o /tmp/shfmt \
            "https://github.com/mvdan/sh/releases/download/v3.12.0/shfmt_v3.12.0_linux_amd64"
          sudo install -m 755 /tmp/shfmt /usr/local/bin/shfmt

      - name: Run shellcheck and shfmt
        run: |
          # git ls-files does not descend into submodules
          mapfile -d '' files < <(git ls-files -z -- '*.sh')
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No tracked shell scripts"
            exit 0
          fi
          shellcheck -- "${files[@]}"
          shfmt -i 2 -ci -d -- "${files[@]}"
